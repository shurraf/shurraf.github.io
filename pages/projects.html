<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <title>Projects</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
        }
        header {
            background-color: #222;
            padding: 15px 0;
        }
        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        nav ul li a:hover {
            color: #00bfff;
        }
        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
            text-align: center;
        }
        h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
            color: #222;
        }
        article {
            background-color: #fff;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        article:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        article h2 {
            margin-top: 0;
            color: #00bfff;
        }
        article p {
            margin: 15px 0;
            line-height: 1.6;
        }
        article a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #00bfff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        article a:hover {
            background-color: #0077b3;
        }
        footer {
            text-align: center;
            padding: 20px 0;
            background-color: #222;
            color: #fff;
            margin-top: 50px;
        }
    </style>
</head>
