        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
        }
        header {
            background-color: #222;
            padding: 15px 0;
        }
        nav ul {
            display: flex;

            list-style: none;

        nav ul li {

        nav ul li a {

            text-decoration: none;

        main {

        }

            background-color: #fff;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        section:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        section h2 {
            margin-top: 0;
            color: #00bfff;
        }
        section p {
            margin: 10px 0;
            line-height: 1.6;
        }
        footer {
            text-align: center;
            padding: 20px 0;
            background-color: #222;
            color: #fff;
            margin-top: 50px;
        }
